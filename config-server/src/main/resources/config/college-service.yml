server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:collegedb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true   # run data.sql AFTER tables are created
  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
